name: Deploy dashboard to GitHub Pages

# Publishes dashboard/index.html (a single, self-contained static file --
# see src/output/build_dashboard.py) to GitHub Pages on every push to main.
#
# One-time manual step required (not doable via this workflow, or any
# API this project has access to): in the repo's Settings -> Pages,
# set "Build and deployment" -> Source to "GitHub Actions". Once that's
# set, this workflow runs automatically on every future push.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
      - id: deployment
        uses: actions/deploy-pages@v4
